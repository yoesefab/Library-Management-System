name: maarif-analytics

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maarif_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-maarif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-maarif_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-maarif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      PRODUCT_IMAGE_DIRECTORY: /app/data/product-images
      BACKEND_PORT: 8080
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Casablanca}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrateur Maarif}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Définir APP_DOMAIN dans .env}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-20}
      EXPENSIVE_RATE_LIMIT: ${EXPENSIVE_RATE_LIMIT:-30}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      JWT_ISSUER: ${JWT_ISSUER:-maarif-analytics}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-maarif-analytics-web}
      JWT_ACCESS_TOKEN_LIFETIME: ${JWT_ACCESS_TOKEN_LIFETIME:-15m}
      JWT_COOKIE_SECURE: "true"
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-30000}
    volumes:
      - product-images:/app/data/product-images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Définir APP_DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?Définir ACME_EMAIL dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:2019/config/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  product-images:
  caddy-data:
  caddy-config:
