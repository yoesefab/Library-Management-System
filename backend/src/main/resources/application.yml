spring:
  application:
    name: maarif-analytics-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:maarif_analytics}}
    username: ${POSTGRES_USER:maarif}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 10s
    max-swallow-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

maarif:
  images:
    directory: ${PRODUCT_IMAGE_DIRECTORY:./data/product-images}
  business-timezone: ${BUSINESS_TIMEZONE:Africa/Casablanca}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Administrateur Maarif}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rate-limit:
    login-per-minute: ${LOGIN_RATE_LIMIT:10}
    upload-per-minute: ${UPLOAD_RATE_LIMIT:20}
    expensive-per-minute: ${EXPENSIVE_RATE_LIMIT:30}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:maarif-analytics}
    audience: ${JWT_AUDIENCE:maarif-analytics-web}
    access-token-lifetime: ${JWT_ACCESS_TOKEN_LIFETIME:15m}
    secure-cookie: ${JWT_COOKIE_SECURE:false}

info:
  app:
    name: Maarif Analytics
    stage: backend
