spring:
  application:
    name: maarif-analytics-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:maarif_analytics}}
    username: ${POSTGRES_USER:maarif}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

maarif:
  images:
    directory: ${PRODUCT_IMAGE_DIRECTORY:./data/product-images}
  business-timezone: ${BUSINESS_TIMEZONE:Africa/Casablanca}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Administrateur Maarif}

info:
  app:
    name: Maarif Analytics
    stage: backend
