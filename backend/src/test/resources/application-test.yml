spring:
  datasource:
    url: jdbc:h2:mem:maarif;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

maarif:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    issuer: maarif-analytics-test
    audience: maarif-analytics-test-client
  images:
    directory: ${java.io.tmpdir}/maarif-analytics-tests/${random.uuid}
